name: CertFlow CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Lint
        uses: golangci/golangci-lint-action@v6
        with:
          working-directory: backend

      - name: Test
        run: go test ./... -v -race -count=1

      - name: Build
        run: CGO_ENABLED=0 go build -o /dev/null ./cmd/server

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "23"

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Type check
        run: npx tsc --noEmit

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: 1

      - name: Secret Scanning (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: \${{ secrets.GITHUB_TOKEN }}

  deploy:
    name: Deploy to GCP Cloud Run
    runs-on: ubuntu-latest
    needs: [backend, frontend, security]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: \${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build and push API
        run: |
          gcloud builds submit backend/ \
            --tag \${{ secrets.GCP_ARTIFACT_REGISTRY }}/api:\${{ github.sha }} \
            --tag \${{ secrets.GCP_ARTIFACT_REGISTRY }}/api:latest

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy certflow-api \
            --image \${{ secrets.GCP_ARTIFACT_REGISTRY }}/api:latest \
            --region europe-southwest1 \
            --allow-unauthenticated \
            --set-env-vars="DATABASE_URL=\${{ secrets.DATABASE_URL }},JWT_SECRET=\${{ secrets.JWT_SECRET }}"
